<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}algotrader{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
<script>
  // Set the theme before first paint so a dark-mode load never flashes light.
  (function () {
    const t = localStorage.getItem('algotrader-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<header class="top">
  <h1>algotrader</h1>
  <nav>
    <a href="/?{{ qs }}" class="{{ 'active' if request.path == '/' }}">Overview</a>
    <a href="/experiments?{{ qs }}" class="{{ 'active' if request.path.startswith('/experiment') }}">Experiments</a>
    <a href="/runs" class="{{ 'active' if request.path == '/runs' }}">Sessions</a>
    <a href="/reports" class="{{ 'active' if request.path == '/reports' }}">Reports</a>
  </nav>
  <span class="spacer"></span>
  <button id="theme-toggle" type="button" title="Toggle light/dark">◐</button>
</header>

<main>
{% block filters %}
  <form class="filters" method="get" id="filter-form">
    <label for="range">Range</label>
    <select name="range" id="range" onchange="this.form.submit()">
      {% for key, (label, _days) in ranges.items() %}
        <option value="{{ key }}" {{ 'selected' if cur.range == key }}>{{ label }}</option>
      {% endfor %}
    </select>

    <label for="symbol">Symbol</label>
    <select name="symbol" id="symbol" onchange="this.form.submit()">
      <option value="">All symbols</option>
      {% for s in all_symbols %}
        <option value="{{ s }}" {{ 'selected' if cur.symbol == s }}>{{ s }}</option>
      {% endfor %}
    </select>

    <button type="submit" name="promoted" value="{{ '' if cur.promoted_only else '1' }}"
            class="{{ 'active-toggle' if cur.promoted_only }}">
      {{ 'Promoted only' if cur.promoted_only else 'Promoted only' }}
    </button>
  </form>
{% endblock %}

{% block content %}{% endblock %}
</main>

<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const root = document.documentElement;
    const now = root.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = now === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('algotrader-theme', next);
    window.dispatchEvent(new Event('theme-change'));   // charts re-read their colors
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
