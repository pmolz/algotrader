# Default configuration. Override per-run on the CLI or with config/local.yaml.

data:
  cache_dir: data_cache
  default_source: ccxt        # ccxt | yfinance
  default_timeframe: 15m
  # Total bars to assemble when fetching (ccxt pages backwards to reach it).
  # 35040 x 15m is one year; venues cap a single request near 1000.
  default_bars: 35040
  # Public OHLCV venue for the ccxt source. Binance blocks some regions; bitstamp
  # and kraken serve public daily history without a key from anywhere.
  ccxt_exchange: bitstamp

backtest:
  initial_cash: 10000.0
  fee_pct: 0.001              # 0.1% per trade (round-trip modelled per fill)
  slippage_pct: 0.0005       # 0.05% assumed slippage per fill
  allow_short: false

validation:
  # Fraction of history reserved as a final holdout the agent must never see.
  oos_holdout_frac: 0.2
  # Walk-forward
  walk_forward_train_frac: 0.6
  walk_forward_n_splits: 5
  # Cost sensitivity: re-run at these multiples of modelled cost. Edge must survive.
  cost_stress_multipliers: [1.0, 1.5, 2.0]
  # Minimum bars required to accept a strategy result as meaningful.
  # Intraday needs far more trades before a Sharpe means anything, and a year
  # of 15m bars supplies them.
  min_trades: 100
  # "A few trades a day." Each round trip pays (fee + slippage) twice, so at
  # 0.15% per fill three trades a day is ~330% of capital per year in friction.
  # This is the constraint that decides whether an intraday idea can exist.
  max_trades_per_day: 4.0
  # Share of exits where stop and target sat inside the same bar and the
  # stop-wins-ties rule decided the outcome. Above this the P&L is an
  # assumption rather than a measurement.
  max_ambiguous_exit_frac: 0.25
  # Promotion thresholds (must pass ALL to advance to paper trading).
  min_sharpe: 1.0
  min_deflated_sharpe: 0.0   # deflated Sharpe > 0 => edge likely survives multiple testing
  max_drawdown_pct: 0.35

experiments:
  db_path: experiments/experiments.db
  generated_code_dir: experiments/generated

agent:
  # provider: ollama (local, free) | anthropic (API)
  provider: ollama
  # For ollama, use a coder-tuned model — general models fail the codegen phase
  # far more often (measured: qwen3.5:9b produced 3 unusable strategies out of 4).
  # Step up to qwen2.5-coder:14b if the machine has the headroom.
  model: qwen2.5-coder:7b

  # Which Ollama server to talk to: "auto", a name from `hosts`, or a bare URL.
  # $OLLAMA_HOST and --ollama-host override this. "auto" walks host_preference
  # and takes the first endpoint that answers AND has the model pulled; naming
  # one pins it (a pinned host that is down means offline fallback, not a
  # silent move to another machine).
  host: auto
  # Preference order for "auto". Names not defined in `hosts` are skipped, so
  # this can mention a laptop you haven't set up yet.
  host_preference: [laptop, local]
  hosts:
    local: http://127.0.0.1:11434
    # Add the networked box in config/local.yaml, e.g.
    #   agent:
    #     hosts:
    #       laptop: {url: http://192.168.1.42:11434, model: qwen2.5-coder:7b}
    # The mapping form lets a smaller-VRAM machine serve a smaller model.

  # Generation budget. A partially-offloaded 14B over the LAN can take minutes
  # per candidate; a timeout here costs a whole iteration.
  request_timeout_s: 900
  # How long to wait when testing whether an endpoint is alive.
  probe_timeout_s: 3

  max_iterations: 10
  # LLM-assisted repair attempts per candidate, for codegen *and* runtime
  # failures. 0 disables retrying.
  max_fix_attempts: 2
  # Number of past experiments (worst + best) fed back as "lessons learned".
  memory_context_n: 8
  # Run untrusted generated code inside a Docker jail (Phase 2). Strongly
  # recommended before any unattended/overnight runs. Requires: bash sandbox/build.sh
  use_sandbox: false

nightly:
  # Markets the unattended session rotates through, one iteration each in turn.
  # Either a plain symbol (uses data.default_source/timeframe) or a mapping.
  # Crypto intraday. Equities are out: no 24/7 tape, and yfinance intraday
  # history is too short to walk forward across.
  symbols:
    - symbol: BTC/USD
      source: ccxt
      timeframe: 15m
    - symbol: ETH/USD
      source: ccxt
      timeframe: 15m
  # Wall-clock budget. The session refuses to start an iteration it can't finish.
  max_hours: 8.0
  # Optional hard cap on iterations (null = only the clock stops it).
  max_iterations: null
  # Have the agent summarize its own progress every N iterations (0 = only at
  # the end). Reflections are stored and fed back into later proposals.
  reflect_every: 10
  log_dir: experiments/logs
  report_dir: experiments/reports
  lock_file: experiments/nightly.lock
  # Morning report window starts at this local hour on the previous day.
  report_window_start_hour: 18

dashboard:
  host: 127.0.0.1           # loopback only; there is no auth on this app
  port: 8765
  # Equity curves are re-run in the sandbox and cached by (code, data, costs).
  cache_dir: experiments/equity_cache
  equity_timeout_s: 60
  # Show a live status card for the machines in agent.hosts: reachable, model
  # resident, and GPU load/temp where the host declares a `gpu` source. GPU
  # numbers for a remote box come from `nvidia-smi` over SSH, so that host needs
  # key-based SSH from here. Turn this off if you bind the dashboard off
  # loopback — it is read-only, but it does make outbound SSH connections.
  host_monitor: true

  # Let the dashboard start/stop agent sessions and toggle the nightly schedule.
  # These are the only endpoints with side effects. Set false to make the whole
  # app strictly read-only (recommended if you ever bind it off loopback).
  allow_control: true

sandbox:
  image: algotrader-sandbox:latest
  memory: 1g
  cpus: "2"
  pids: 128
  timeout_s: 120
