# Default configuration. Override per-run on the CLI or with config/local.yaml.

data:
  cache_dir: data_cache
  default_source: ccxt        # ccxt | yfinance
  default_timeframe: 1d
  # Public OHLCV venue for the ccxt source. Binance blocks some regions; bitstamp
  # and kraken serve public daily history without a key from anywhere.
  ccxt_exchange: bitstamp

backtest:
  initial_cash: 10000.0
  fee_pct: 0.001              # 0.1% per trade (round-trip modelled per fill)
  slippage_pct: 0.0005       # 0.05% assumed slippage per fill
  allow_short: false

validation:
  # Fraction of history reserved as a final holdout the agent must never see.
  oos_holdout_frac: 0.2
  # Walk-forward
  walk_forward_train_frac: 0.6
  walk_forward_n_splits: 5
  # Cost sensitivity: re-run at these multiples of modelled cost. Edge must survive.
  cost_stress_multipliers: [1.0, 1.5, 2.0]
  # Minimum bars required to accept a strategy result as meaningful.
  min_trades: 30
  # Promotion thresholds (must pass ALL to advance to paper trading).
  min_sharpe: 1.0
  min_deflated_sharpe: 0.0   # deflated Sharpe > 0 => edge likely survives multiple testing
  max_drawdown_pct: 0.35

experiments:
  db_path: experiments/experiments.db
  generated_code_dir: experiments/generated

agent:
  # provider: ollama (local, free) | anthropic (API)
  provider: ollama
  # For ollama, use a coder-tuned model — general models fail the codegen phase
  # far more often (measured: qwen3.5:9b produced 3 unusable strategies out of 4).
  # Step up to qwen2.5-coder:14b if the machine has the headroom.
  model: qwen2.5-coder:7b
  max_iterations: 10
  # Number of past experiments (worst + best) fed back as "lessons learned".
  memory_context_n: 8
  # Run untrusted generated code inside a Docker jail (Phase 2). Strongly
  # recommended before any unattended/overnight runs. Requires: bash sandbox/build.sh
  use_sandbox: false

nightly:
  # Markets the unattended session rotates through, one iteration each in turn.
  # Either a plain symbol (uses data.default_source/timeframe) or a mapping.
  symbols:
    - symbol: BTC/USD
      source: ccxt
      timeframe: 1d
    - symbol: ETH/USD
      source: ccxt
      timeframe: 1d
    - symbol: SPY
      source: yfinance
      timeframe: 1d
  # Wall-clock budget. The session refuses to start an iteration it can't finish.
  max_hours: 8.0
  # Optional hard cap on iterations (null = only the clock stops it).
  max_iterations: null
  # Have the agent summarize its own progress every N iterations (0 = only at
  # the end). Reflections are stored and fed back into later proposals.
  reflect_every: 10
  log_dir: experiments/logs
  report_dir: experiments/reports
  lock_file: experiments/nightly.lock
  # Morning report window starts at this local hour on the previous day.
  report_window_start_hour: 18

dashboard:
  host: 127.0.0.1           # loopback only; there is no auth on this app
  port: 8765
  # Equity curves are re-run in the sandbox and cached by (code, data, costs).
  cache_dir: experiments/equity_cache
  equity_timeout_s: 60
  # Let the dashboard start/stop agent sessions and toggle the nightly schedule.
  # These are the only endpoints with side effects. Set false to make the whole
  # app strictly read-only (recommended if you ever bind it off loopback).
  allow_control: true

sandbox:
  image: algotrader-sandbox:latest
  memory: 1g
  cpus: "2"
  pids: 128
  timeout_s: 120
